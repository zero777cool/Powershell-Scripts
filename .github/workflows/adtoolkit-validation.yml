name: ADToolkit Validation

on:
  push:
    paths:
      - 'ADToolkit/**'
      - '.github/workflows/adtoolkit-validation.yml'
  pull_request:
    paths:
      - 'ADToolkit/**'
      - '.github/workflows/adtoolkit-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ADToolkit static validation
        shell: pwsh
        working-directory: ADToolkit
        run: .\Tests\Validate-ADToolkit.ps1
